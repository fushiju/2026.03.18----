[pytest]
testpaths = api ui
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    p0: P0 阻塞上线用例
    p1: P1 重要用例
    p2: P2 一般用例
    api: 接口测试
    ui: UI 测试
    smoke: 冒烟测试
    commission: 分佣系统
    dining: 餐饮折扣
    order: 订单管理
    payment: 支付流程
    product: 选品仓库
    permission: 权限控制
    security: 安全测试
    withdraw: 提现结算
